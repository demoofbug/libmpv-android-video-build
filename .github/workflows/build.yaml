name: Build libmpv-android

on:
  push:
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'

# main branch pushes do not trigger builds; tags build and publish,
# pull requests and manual dispatch build only (nothing is uploaded).

permissions:
  contents: write

env:
  # On tag builds the tag (v<engine-version>+<build-number>) is passed to the
  # bundle scripts; otherwise they fall back to v$v_mpv+0. See README.
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Symlink SDK
        working-directory: ./buildscripts
        run: |
          mkdir sdk
          ln -s ${ANDROID_HOME} ./sdk/android-sdk-linux
      - name: Bundle (default)
        working-directory: ./buildscripts
        run: |
          sudo chmod +x bundle_default.sh
          ./bundle_default.sh
      - name: Bundle (full)
        working-directory: ./buildscripts
        run: |
          sudo chmod +x bundle_full.sh
          ./bundle_full.sh
      # encoders-gpl is not built: fftools-ffi does not compile against the
      # ffmpeg 9 API (see README, Version history). Re-enable once upstream
      # ports it.
      # - name: Bundle (encoders-gpl)
      #   working-directory: ./buildscripts
      #   run: |
      #     sudo chmod +x bundle_encoders-gpl.sh
      #     ./bundle_encoders-gpl.sh
      - name: Upload Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          draft: false
          prerelease: false
          tag_name: ${{ github.ref_name }}
          files: |
            buildscripts/*.zip
            buildscripts/artifacts/**
